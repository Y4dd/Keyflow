name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      VITE_BASE: /${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run check:rules
      - run: npx playwright install --with-deps chromium firefox
      # The runner has no sound device. Chromium falls back to a silent output on its own;
      # Firefox's AudioContext never starts without one, so give it a silent PulseAudio sink.
      - name: Add a silent audio device
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=silent
          pactl set-default-sink silent
          pactl info
      - run: npm run test:e2e
        env:
          # e2e serves the build at the local root, not the Pages sub-path.
          VITE_BASE: /
      - run: npm run build
      - name: Check dev tools are not in the production build
        run: |
          if grep -rl "__keyflow" dist; then
            echo "Dev tools (window.__keyflow) leaked into the production build."
            exit 1
          fi
      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
